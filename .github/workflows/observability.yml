name: observability

# 可观测性改动的 PR 门禁：
# 不需要任何真实凭据（OTEL/LANGFUSE 默认关闭），也不启动 Grafana 栈；
# 规则/配置/dashboard 全部做静态校验，故障注入在本机用 scripts/fault-injection-observability.sh。
on:
  pull_request:
    paths:
      - 'packages/observability/**'
      - 'apps/api/src/observability.ts'
      - 'apps/worker/**'
      - 'apps/knowledge-service/**'
      - 'packages/contracts/**'
      - 'deploy/observability/**'
      - 'deploy/compose.observability.yaml'
      - 'deploy/systemd/**'
      - 'scripts/verify-observability.sh'
      - '.github/workflows/observability.yml'
  workflow_dispatch: {}

concurrency:
  group: observability-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.24.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Observability package typecheck / test / build
        run: |
          pnpm --filter @repo/observability typecheck
          pnpm --filter @repo/observability test
          pnpm --filter @repo/observability build

      - name: Downstream package typecheck
        run: pnpm --filter @repo/agent-api --filter @repo/agent-worker --filter @repo/knowledge-service --filter @repo/contracts typecheck

      - name: Downstream package tests
        run: |
          pnpm --filter @repo/contracts test
          pnpm --filter @repo/agent-api test
          pnpm --filter @repo/agent-worker test
          pnpm --filter @repo/knowledge-service test

  deploy-config-checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Prometheus rules + config
        run: |
          docker run --rm \
            -v "$PWD/deploy/observability:/etc/obs:ro" \
            --entrypoint /bin/sh prom/prometheus:v2.54.1 \
            -c 'promtool check rules /etc/obs/prometheus/rules/*.yaml'
          docker run --rm \
            -v "$PWD/deploy/observability:/etc/obs:ro" \
            --entrypoint promtool prom/prometheus:v2.54.1 \
            check config /etc/obs/prometheus/prometheus.yaml

      - name: Alertmanager config (env-expanded like entrypoint.sh)
        run: |
          docker run --rm \
            -v "$PWD/deploy/observability/alertmanager:/am:ro" \
            --entrypoint /bin/sh prom/alertmanager:v0.27.0 -c '
              set -eu
              sed -e "s|\${PAGE_WEBHOOK_URL}|http://example.invalid/page|g" \
                  -e "s|\${URGENT_WEBHOOK_URL}|http://example.invalid/urgent|g" \
                  -e "s|\${TICKET_WEBHOOK_URL}|http://example.invalid/ticket|g" \
                /am/alertmanager.yaml > /tmp/am.yaml
              amtool check-config /tmp/am.yaml
            '

      - name: Compose config interpolation
        run: |
          GRAFANA_ADMIN_PASSWORD=dummy docker compose -f deploy/compose.observability.yaml config -q
          docker compose -f deploy/compose.infra.yaml --env-file deploy/env.production.example config -q

      - name: Dashboards are valid JSON with low-cardinality templating
        run: |
          python3 - <<'PY'
          import json, glob, sys
          bad = []
          for path in glob.glob('deploy/observability/grafana/dashboards/*.json'):
              with open(path) as f:
                  d = json.load(f)
              for v in d.get('templating', {}).get('list', []):
                  if v.get('type') == 'query' and v.get('datasource'):
                      name = v.get('name', '')
                      if name not in {'service', 'route', 'quantile'}:
                          bad.append(f'{path}: unexpected variable {name}')
              if d.get('schemaVersion') != 39:
                  bad.append(f'{path}: schemaVersion {d.get("schemaVersion")} != 39')
          if bad:
              print('\n'.join(bad)); sys.exit(1)
          print('dashboards OK:', len(glob.glob('deploy/observability/grafana/dashboards/*.json')))
          PY

      - name: Secret / high-cardinality scan
        run: |
          # 1a) 密钥形态（全文件类型）
          if grep -rnE 'sk-[A-Za-z0-9]{20,}|BEGIN (RSA|OPENSSH|EC) PRIVATE KEY' \
               deploy/observability deploy/systemd .github/workflows 2>/dev/null; then
            echo '::error::possible key material committed'; exit 1
          fi
          # 1b) 明文口令形态（仅配置/单元/脚本，排除占位词与探针）
          if grep -rnE --include='*.yaml' --include='*.yml' --include='*.conf' \
               --include='*.service' --include='*.timer' --include='*.sh' \
               'password\s*[:=]\s*[^$<" ]{8,}' \
               deploy/observability deploy/systemd .github/workflows 2>/dev/null \
             | grep -vE 'synthetic-|dummy|REPLACE_|changeme|example\.'; then
            echo '::error::possible plaintext password committed'; exit 1
          fi
          # 2) 告警规则/录制规则 label 不得出现高基数维度
          if grep -rnE 'run_id|user_id|tenant_id|session_id|trace_id' deploy/observability/prometheus deploy/observability/prometheus/rules; then
            echo '::error::high-cardinality label in prometheus rules'; exit 1
          fi
          # 3) systemd 单元必须带遥测预载与 15s 停止上限
          for unit in chat-api chat-worker chat-knowledge; do
            grep -q -- '--import /opt/chat/packages/observability/dist/register.js' "deploy/systemd/$unit.service"
            grep -q '^TimeoutStopSec=15$' "deploy/systemd/$unit.service"
          done
          echo 'secret/guardrail scan OK'
