# /etc/nginx/conf.d/chat.conf
#
# 结构：
#   chat.example.com:443   → Web(3020) + API(8002)，API 直连绕过 Next，SSE 少一跳
#   chat.example.com:9443  → MinIO(59000)，供浏览器使用预签名 URL 直传/下载
#
# 替换 chat.example.com 为你的域名；证书路径按实际修改。

upstream chat_web   { server 127.0.0.1:3020;  keepalive 16; }
upstream chat_api   { server 127.0.0.1:8002;  keepalive 16; }
upstream chat_minio { server 127.0.0.1:59000; keepalive 16; }

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      '';
}

# ---------- HTTP：仅用于跳转和 ACME 校验 ----------
server {
    listen 80;
    listen [::]:80;
    server_name chat.example.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------- 主站 ----------
server {
    # Debian 12 自带 nginx 1.22，只支持这种写法；nginx ≥1.25.1 可改成
    #   listen 443 ssl;  +  http2 on;
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name chat.example.com;

    ssl_certificate     /etc/letsencrypt/live/chat.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/chat.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;

    # Fastify bodyLimit = max(1MB, PROJECT_UPLOAD_MAX_BYTES*2) = 40MB，这里留足余量
    client_max_body_size 50m;

    # ---- 流式（SSE）必需：整段关闭缓冲 ----
    proxy_http_version 1.1;
    proxy_set_header Host              $http_host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade           $http_upgrade;
    proxy_set_header Connection        $connection_upgrade;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    chunked_transfer_encoding on;

    # API 直连：聊天流式、历史、SSE 全部走这里
    location /api/ {
        proxy_pass http://chat_api;
    }

    # 知识库页面本次不部署 knowledge-service，建议先挡掉，避免出现"能上传但永远索引中"。
    # 启用知识库后删掉这段即可。
    location = /knowledge {
        return 404;
    }

    location / {
        proxy_pass http://chat_web;
    }
}

# ---------- 对象存储（预签名 URL） ----------
# 用独立端口而不是子域名，省一条 DNS 记录；证书用同一张。
server {
    listen 9443 ssl http2;
    listen [::]:9443 ssl http2;
    server_name chat.example.com;

    ssl_certificate     /etc/letsencrypt/live/chat.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/chat.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 200m;
    # MinIO 需要原始 header
    ignore_invalid_headers off;

    proxy_http_version 1.1;
    # 必须保留端口：SigV4 签名里包含 Host，丢了端口会 SignatureDoesNotMatch
    proxy_set_header Host              $http_host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;

    location / {
        proxy_pass http://chat_minio;
    }
}
