# 全项目通用的 Gradle 设置。

# IDE（例如 Android Studio）用户请注意：
# 在 IDE 中配置的 Gradle 设置会覆盖此文件中的设置。

# 构建环境配置详情请参阅：
# http://www.gradle.org/docs/current/userguide/build_environment.html

# 指定守护进程使用的 JVM 参数。
# 此设置尤其适用于调整内存配置。
# 默认值：-Xmx512m -XX:MaxMetaspaceSize=256m
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m

# 启用后，Gradle 会以实验性的并行模式运行。
# 此选项仅适用于相互独立的项目。详情请参阅：
# http://www.gradle.org/docs/current/userguide/multi_project_builds.html#sec:decoupled_projects
org.gradle.parallel=true

# AndroidX 包结构可明确区分 Android 操作系统内置的包与打包在应用 APK 中的包。
# https://developer.android.com/topic/libraries/support-library/androidx-rn
android.useAndroidX=true

# 启用 AAPT2 PNG 压缩。
android.enablePngCrunchInReleaseBuilds=true

# 使用此属性指定要构建的架构。
# 也可以通过命令行覆盖：
# ./gradlew <task> -PreactNativeArchitectures=x86_64
reactNativeArchitectures=armeabi-v7a,arm64-v8a,x86,x86_64

# 使用此属性启用新架构支持。
# 启用后，应用可以使用 TurboModules 和 Fabric 渲染器。如果要编写自定义的
# TurboModules/Fabric 组件，或使用提供这些组件的库，请启用此标记。
newArchEnabled=true

# 使用此属性启用或禁用 Hermes JS 引擎。
# 设为 false 时会改用 JSC。
hermesEnabled=true

# 使用此属性启用全面屏显示支持。
# 启用后，应用内容可以延伸到系统栏后方，打造沉浸式界面。
# 注意：仅适用于 ReactActivity，不应与自定义 Activity 搭配使用。
edgeToEdgeEnabled=true

# 在 React Native 图片中启用 GIF 支持（约增加 200 B）。
expo.gif.enabled=true
# 在 React Native 图片中启用 WebP 支持（约增加 85 KB）。
expo.webp.enabled=true
# 启用动态 WebP 支持（约增加 3.4 MB）。
# 默认禁用，因为 iOS 不支持动态 WebP。
expo.webp.animated=false

# 启用网络检查器。
EX_DEV_CLIENT_NETWORK_INSPECTOR=true

# 使用旧版打包方式压缩生成的 APK 中的原生库。
expo.useLegacyPackaging=false

# 指定应用是否通过应用配置或插件启用了全面屏显示。
# 警告：此属性已弃用，并将在 Expo SDK 55 中移除。请使用 `edgeToEdgeEnabled` 或
# `react.edgeToEdgeEnabled` 判断项目是否启用了全面屏显示。
expo.edgeToEdgeEnabled=true
# 网络受限：dl.google.com 需走本地代理（maven central / gradle 官方源可直连）
systemProp.http.proxyHost=127.0.0.1
systemProp.http.proxyPort=17890
systemProp.https.proxyHost=127.0.0.1
systemProp.https.proxyPort=17890
