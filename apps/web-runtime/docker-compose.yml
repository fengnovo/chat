version: '3.8'

services:
  web-preview:
    build:
      context: ../../infra/sandbox
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    volumes:
      # 挂载工作区，AI 修改代码后 Vite 自动热更新
      - ./workspace:/mnt/user-data/workspace
    environment:
      - NODE_ENV=development
      - VITE_PORT=5173
    command: run-web-preview
